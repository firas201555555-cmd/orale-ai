<title>ORALE AI | INFINITY ULTRA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

:root {
  --purple:#a855f7;
  --blue:#22d3ee;
  --bg:#05040d;
  --glass:rgba(20,16,40,.72);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:#fff;
  font-family:'Cairo',Arial,sans-serif;
  background:
    radial-gradient(ellipse at 15% 20%,#53128a55,transparent 38%),
    radial-gradient(ellipse at 85% 75%,#063b7850,transparent 40%),
    var(--bg);
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:55px 55px;opacity:.22;
  animation:stars 35s linear infinite;
}
@keyframes stars{to{background-position:0 550px}}
body:after{
  content:"";position:fixed;width:500px;height:500px;
  background:#7c3aed20;filter:blur(100px);
  top:20%;left:25%;pointer-events:none;z-index:-1;
}
button,input{font:inherit}
button{cursor:pointer}
header{
  height:78px;padding:0 5%;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #ffffff15;
  background:#090714b8;backdrop-filter:blur(25px);
  position:sticky;top:0;z-index:10;
}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}
.logo span{
  background:linear-gradient(90deg,#c084fc,#22d3ee);
  -webkit-background-clip:text;color:transparent;
}
.header-right{display:flex;align-items:center;gap:18px}
.online{color:#86efac;font-size:12px}
.avatar{
  width:39px;height:39px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#9333ea,#2563eb);
  box-shadow:0 0 20px #9333ea77;
}
.layout{
  max-width:1500px;margin:auto;padding:22px;
  display:grid;grid-template-columns:230px minmax(0,1fr) 230px;
  gap:20px;
}
.glass{
  background:linear-gradient(145deg,rgba(35,23,65,.76),rgba(10,15,35,.78));
  border:1px solid #b78aff27;border-radius:22px;
  box-shadow:0 20px 65px #0006,inset 0 1px #ffffff12;
  backdrop-filter:blur(22px);
}
.sidebar,.rightbar{padding:20px;height:max-content;position:sticky;top:100px}
.section-title{color:#c4b5fd;font-size:14px;margin:5px 0 18px}
.nav{
  width:100%;padding:13px 12px;margin:5px 0;
  border:1px solid transparent;border-radius:13px;
  color:#cbd5e1;background:transparent;text-align:right;
  transition:.25s;
}
.nav:hover,.nav.active{
  background:linear-gradient(90deg,#8b5cf633,#2563eb22);
  border-color:#a78bfa44;color:#fff;
}
main{text-align:center;min-width:0;padding:12px 5px}
.hero{padding:15px 0 5px}
.orb-area{
  width:230px;height:220px;margin:auto;
  display:grid;place-items:center;position:relative;
}
.orb{
  width:120px;height:120px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,#fff 0%,#c4b5fd 8%,#9333ea 32%,#312e81 68%,#080b25 100%);
  box-shadow:0 0 35px #a855f7,0 0 90px #7c3aed99,
  inset -15px -20px 35px #080b36;
  animation:float 4s ease-in-out infinite;
  position:relative;z-index:2;
}
.orb:after{
  content:"";position:absolute;inset:20px;border-radius:50%;
  border:1px solid #ffffff88;filter:blur(2px);
}
.ring{
  position:absolute;width:210px;height:75px;border:2px solid #a78bfa;
  border-radius:50%;transform:rotate(-25deg);
  box-shadow:0 0 20px #a855f788;
  animation:spin 12s linear infinite;
}
.ring.two{
  width:220px;height:95px;border-color:#22d3ee;
  transform:rotate(45deg);animation:spin2 15s linear infinite;
}
@keyframes float{50%{transform:translateY(-13px) scale(1.06)}}
@keyframes spin{to{transform:rotate(335deg)}}
@keyframes spin2{to{transform:rotate(405deg)}}
.eyebrow{
  display:inline-block;padding:6px 15px;border-radius:30px;
  color:#d8b4fe;background:#a855f71b;
  border:1px solid #a855f744;font-size:12px;
}
h1{font-size:clamp(30px,5vw,49px);line-height:1.4;margin:13px 0}
.gradient{
  background:linear-gradient(90deg,#c084fc,#67e8f9);
  -webkit-background-clip:text;color:transparent;
}
.subtitle{color:#a1a1b8;line-height:2;font-size:14px}
.cards{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;max-width:680px;margin:28px auto;
}
.suggestion{
  text-align:right;padding:17px;border-radius:17px;
  background:linear-gradient(140deg,#21163dcc,#111b35cc);
  border:1px solid #a78bfa33;color:#fff;
  transition:.3s;
}
.suggestion:hover{
  transform:translateY(-5px);border-color:#a78bfa;
  box-shadow:0 12px 35px #7c3aed33;
}
.suggestion strong{display:block;margin-bottom:5px}
.suggestion small{color:#9ca3af}
.chat{
  max-width:720px;margin:20px auto;
  display:flex;flex-direction:column;gap:12px;text-align:right;
}
.message{
  max-width:85%;padding:12px 17px;border-radius:16px;
  line-height:1.8;white-space:pre-wrap;
}
.user{align-self:flex-start;background:linear-gradient(135deg,#7134b5,#3545a0)}
.bot{align-self:flex-end;background:#17162a;border:1px solid #ffffff18}
.composer{
  max-width:720px;margin:20px auto;
  display:flex;gap:10px;padding:9px;
  background:#111024dd;border:1px solid #9b72ff66;
  border-radius:19px;box-shadow:0 0 35px #7c3aed22;
  transition:.3s;
}
.composer:focus-within{
  border-color:#22d3ee;box-shadow:0 0 30px #22d3ee22;
}
.composer input{
  flex:1;min-width:0;background:transparent;
  border:0;outline:0;color:#fff;padding:12px;
}
.send{
  border:0;border-radius:13px;padding:10px 22px;
  color:white;font-weight:800;
  background:linear-gradient(120deg,#9333ea,#2563eb);
  box-shadow:0 0 20px #7c3aed55;
}
.send:hover{filter:brightness(1.2);transform:translateY(-2px)}
.tool{
  width:100%;padding:13px;margin:6px 0;
  background:#ffffff08;border:1px solid #ffffff10;
  border-radius:12px;color:#ddd;text-align:right;
}
.tool:hover{border-color:#a78bfa;color:white}
.stat{
  margin-top:15px;padding:15px;border-radius:15px;
  background:#ffffff08;border:1px solid #ffffff10;
}
.stat b{display:block;color:#c4b5fd;font-size:20px}
.stat small{color:#999}
.footer{font-size:11px;color:#777;margin:30px 0 15px}
@media(max-width:1000px){
  .layout{grid-template-columns:1fr}
  .sidebar,.rightbar{display:none}
}
@media(max-width:550px){
  header{padding:0 15px}
  .layout{padding:12px}
  .cards{grid-template-columns:1fr}
  .online{display:none}
  .orb-area{transform:scale(.85)}
}
</style>
</head>
<body>

<header>
  <div class="logo">✦ ORALE <span>AI</span></div>
  <div class="header-right">
    <span class="online">● النظام التجريبي جاهز</span>
    <div class="avatar">✦</div>
  </div>
</header>

<div class="layout">

  <aside class="glass sidebar">
    <div class="section-title">مساحة العمل</div>
    <button class="nav active" onclick="newChat()">✦ محادثة جديدة</button>
    <button class="nav" onclick="showInfo()">◈ حول ORALE AI</button>
    <button class="nav" onclick="clearChat()">⌫ مسح المحادثة</button>
    <div class="section-title" style="margin-top:30px">حسابك</div>
    <div class="stat"><b>INFINITY</b><small>الإصدار التجريبي</small></div>
  </aside>

  <main>
    <section class="hero">
      <div class="orb-area">
        <div class="ring"></div>
        <div class="ring two"></div>
        <div class="orb"></div>
      </div>
      <span class="eyebrow">✧ الجيل الجديد من الإبداع</span>
      <h1>أهلاً بك في <span class="gradient">ORALE AI</span></h1>
      <p class="subtitle">
        عالمك الذكي يبدأ بفكرة.<br>
        اسأل، اكتشف، واصنع شيئاً مذهلاً.
      </p>
    </section>

    <div class="cards">
      <button class="suggestion" onclick="suggest('علمني البرمجة من الصفر')">
        <strong>⌘ تعلم البرمجة</strong>
        <small>ابدأ رحلتك في عالم الأكواد</small>
      </button>
      <button class="suggestion" onclick="suggest('أعطني فكرة لمشروع جديد')">
        <strong>✧ أفكار إبداعية</strong>
        <small>حوّل أفكارك إلى مشاريع</small>
      </button>
      <button class="suggestion" onclick="suggest('ساعدني في الدراسة')">
        <strong>◈ مساعد الدراسة</strong>
        <small>نظّم مراجعتك وتعلّم بسهولة</small>
      </button>
      <button class="suggestion" onclick="suggest('اقترح لعبة رعب ممتعة')">
        <strong>🎮 عالم الألعاب</strong>
        <small>اكتشف أفكار ألعاب جديدة</small>
      </button>
    </div>

    <section class="chat" id="chat"></section>

    <div class="composer">
      <input id="message" placeholder="اكتب سؤالك هنا..." 
        onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="send" onclick="sendMessage()">إرسال ➤</button>
    </div>
    <div class="footer">✦ ORALE AI — INFINITY ULTRA ✦</div>
  </main>

  <aside class="glass rightbar">
    <div class="section-title">الأدوات الذكية</div>
    <button class="tool" onclick="suggest('ساعدني في كتابة HTML')">⌘ مساعد البرمجة</button>
    <button class="tool" onclick="suggest('أعطني فكرة لموقع')">✧ مولد الأفكار</button>
    <button class="tool" onclick="suggest('ساعدني في المراجعة')">◈ مساعد الدراسة</button>
    <div class="stat">
      <b>∞</b>
      <small>إبداع بلا حدود</small>
    </div>
    <p style="color:#777;font-size:11px;line-height:1.8;margin-top:20px">
      هذه نسخة تجريبية بواجهة وردود جاهزة.
    </p>
  </aside>

</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.textContent=text;
  chat.appendChild(div);
  div.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function getReply(text){
  const t=text.toLowerCase();
  if(t.includes("سلام")||t.includes("مرحبا")||t.includes("hello"))
    return "أهلاً بك في ORALE AI! ✨ كيف نقدر نساعدك؟";
  if(t.includes("برمج")||t.includes("html")||t.includes("كود"))
    return "💻 البرمجة تبدأ خطوة بخطوة. تعلّم HTML ثم CSS وبعدها JavaScript!";
  if(t.includes("لعبة"))
    return "🎮 فكرة رائعة! نقدر نبدأ بلعبة صغيرة ثم نطوّرها معاً.";
  if(t.includes("دراسة")||t.includes("مراجعة"))
    return "📚 قسّم دراستك إلى حصص قصيرة وخذ استراحة بينها. بالتوفيق!";
  if(t.includes("فكرة")||t.includes("مشروع"))
    return "💡 ماذا عن إنشاء موقع يجمع الألعاب والأدوات التعليمية؟";
  return "✨ وصلتني رسالتك! أنا ORALE AI في نسختي التجريبية، وردودي حالياً جاهزة ومحدودة.";
}

async function sendMessage(){
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const loading = document.createElement("div");
  loading.className = "message bot";
  loading.textContent = "جاري التفكير... ✨";
  chat.appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();
    loading.textContent = data.reply || "لم تصل إجابة.";
  } catch (error) {
    loading.textContent = "تعذر الاتصال بالخادم. حاول مرة أخرى.";
  }
}
}
function suggest(text){
  input.value=text;
  sendMessage();
}
function newChat(){
 chat.innerHTML="";
  addMessage(
    "مرحباً بك في ORALE AI! ✨ أنا مساعد ذكي تجريبي. قد أخطئ أحياناً، لذلك تحقق من المعلومات المهمة. لا تشارك كلمات المرور أو معلوماتك الشخصية الحساسة.",
    "bot"
  );
} 
}
function clearChat(){chat.innerHTML=""}
function showInfo(){
  addMessage("ORALE AI مشروع مساعد رقمي تجريبي بتصميم INFINITY ULTRA. 🚀","bot");
}
</script>
</body>
</html>
<div class="api-box">
  <h3>🔑 Gemini API</h3>

  <input
    id="apiKey"
    type="password"
    placeholder="ضع مفتاح API هنا"
  >

  <button onclick="toggleKey()">إظهار / إخفاء</button>
  <button onclick="sendKey()">إرسال</button>

  <p id="apiStatus"></p>
</div>

<style>
.api-box {
  max-width: 500px;
  margin: 20px auto;
  padding: 18px;
  background: #10243b;
  color: white;
  border: 1px solid #55c8ff;
  border-radius: 15px;
  text-align: center;
}
.api-box input {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #55c8ff;
}
.api-box button {
  padding: 10px 16px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  background: #168bd0;
  color: white;
  cursor: pointer;
}
</style>

<script>
function toggleKey() {
  const input = document.getElementById("apiKey");
  input.type = input.type === "password" ? "text" : "password";
}

function sendKey() {
  const key = document.getElementById("apiKey").value.trim();
  const status = document.getElementById("apiStatus");

  if (!key) {
    status.textContent = "أدخل المفتاح أولاً.";
    return;
  }

  status.textContent =
    "لا ترسل المفتاح من الصفحة العامة. أضفه في Vercel باسم GEMINI_API_KEY.";
}
</script>
